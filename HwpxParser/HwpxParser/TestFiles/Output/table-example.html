<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Table Example</title>
<style>
:root {
  --hwpunit-mm: 0.00352778mm;
}

.hwp-table {
  display: inline-table;
  width: 168.26mm;
  min-height: 14.74mm;
  margin: 0.998mm;
  padding: 0.497mm;
  border: 0.12mm solid #000;
  border-collapse: collapse;
  table-layout: fixed;
  font-family: "돋움체","돋움","굴림",sans-serif;
  font-size: 10pt;
  line-height: 1.6;
  color: #ffffff;
  text-align: center;
  background-color: transparent;
}

.hwp-table td {
  padding: 1.799mm 1.799mm 0.497mm 1.799mm;
  border-left: 0.12mm solid #000;
  border-right: none;
  border-top: 0.12mm solid #000;
  border-bottom: 0.12mm solid #000;
  vertical-align: middle;
}

.hwp-inline-picture {
  margin: 0 0 4px;
}

.hwp-paragraph {
  margin: 0;
  line-height: 1.6;
}
</style>
</head>
<body>

<table class="hwp-table" data-hwp-id="1856774880">
  <tr>
    <td data-name="기관명">
      <figure class="hwp-inline-picture">
        <img src="resources/image1.png" alt="기관명 로고" width="10162" height="3193">
      </figure>
      <p class="hwp-paragraph">행정안전부</p>
    </td>
  </tr>
</table>

</body>
</html>
