<html lang="ko">
  <head>
    <title>HWPX Converter</title>
    <meta charset="utf-8" />
    <style></style>
  </head>
  <body>
    <div
      style="
        height: 841.88pt;
        position: relative;
        width: 595.28pt;
        padding-bottom: 42.51pt;
        box-sizing: border-box;
        background-color: rgb(10, 142, 236);
        padding-right: 56.69pt;
        padding-left: 56.69pt;
        padding-top: 42.51pt;
      "
    >
  <!-- hp:p id="0" (paraPrIDRef=40) 전체 문단 -->
<div id="p0" style="
  position: relative;
  width: 481.88pt;            /* hp:lineseg horzsize 48188 /100 */
  height: auto;
  text-align: justify;        /* paraPr 40: JUSTIFY */
  text-indent: -27.44pt;      /* hh:margin intent -2744 /100 */
  line-height: 69.904pt;      /* 계산: textheight(4744)/100 * (1 + 60/100) - 600/100
                                 -> 47.44 * 1.6 - 6 = 69.904pt */
  margin-top: 0pt;            /* hh:margin prev 0 */
  margin-bottom: 0pt;         /* hh:margin next 0 */
  margin-left: 0pt;           /* hh:margin left 0 */
  margin-right: 0pt;          /* hh:margin right 0 */
  box-sizing: border-box;
">

  <!-- Table (hp:tbl) -->
  <div style="display: block; width:476.97pt; /* hp:tbl hp:sz width 47697 /100 */
              margin-left: 2.83pt; margin-right: 2.83pt; /* hp:tbl outMargin left/right 283 /100 */
              margin-top: 2.83pt; margin-bottom: 2.83pt; /* outMargin top/bottom */
              ">
    <table style="width:476.97pt; height:41.78pt; border-collapse:collapse;">
      <tr>
        <!-- td: use cellSz and padding from (table inMargin + cellMargin) -->
        <td style="
        background-color: aliceblue;
          width:133.52pt;                /* hp:tc hp:cellSz width 13352 /100 */
          height:41.78pt;                /* hp:tc hp:cellSz height 4178 /100 */
          padding-left:6.51pt;           /* table inMargin left 141 + cellMargin left 510 = 651 /100 */
          padding-right:6.51pt;          /* same as left */
          padding-top:2.82pt;            /* table inMargin top 141 + cellMargin top 141 = 282 /100 */
          padding-bottom:2.82pt;
          vertical-align: middle;        /* hp:subList vertAlign="CENTER" */
          box-sizing:border-box;
        ">

          <!-- 내부: 이미지 문단 (paraPrIDRef=45) -->
          <div id="p_in_img" style="
            text-align: center;            /* paraPr 45: CENTER */
            text-indent: 0pt;              /* intent 0 */
            line-height: 41.895pt;         /* 계산: textheight(3193)/100 * (1 + 50/100) - 600/100
                                             -> 31.93 * 1.5 - 6 = 41.895pt */
            margin: 0;
            box-sizing: border-box;
          ">
            <!-- 임의 이미지: hp:pic curSz width=10162 height=3193 -->
            <img src="./BinData/image1.jpg" alt="image" style="width:101.62pt; height:31.93pt; display:inline-block;">
          </div>

          <!-- 내부: 텍스트 문단 (paraPrIDRef=18) -->
          <div id="p_in_text" style="
            text-align: center;            /* paraPr 18: CENTER */
            text-indent: 0pt;              /* intent 0 */
            line-height: 32.00pt;          /* 계산: textheight(1000)/100 * (1 + 160/100) + 600/100
                                             -> 10.00 * 2.6 + 6 = 32.00pt
                                             (paraPr 18 value=160 interpreted as +160%) */
            margin: 0;
            box-sizing: border-box;
          ">
            행정안전부
          </div>

        </td>
        <!-- 나머지 셀(간단히 빈 셀로 둠; colCnt=3 인 점 감안) -->
        <td style="width:133.52pt;"></td>
        <td style="width:210.93pt;"></td>
      </tr>
    </table>
  </div>

</div>

  </div>
  </body>
</html>
